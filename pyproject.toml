[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openanchor"
version = "0.2.0b1"
description = "Multi-material mechanical anchor brims for OrcaSlicer (beta)"
readme = "README.md"
authors = [{name = "Nikotina0001"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["numpy>=1.26,<3", "shapely>=2.1,<3", "trimesh>=4.5,<6", "manifold3d>=3.5.4,<4", "mapbox-earcut>=1,<3"]

[project.urls]
Homepage = "https://github.com/Nikotina0001/OpenAnchor"
Documentation = "https://github.com/Nikotina0001/OpenAnchor#readme"
Issues = "https://github.com/Nikotina0001/OpenAnchor/issues"
Changelog = "https://github.com/Nikotina0001/OpenAnchor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
openanchor = "openanchor.cli:main"

[tool.setuptools]
packages = ["openanchor"]

[tool.setuptools.package-data]
openanchor = ["page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
